<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-label="Videur — programmatic video studio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a10"/>
      <stop offset="0.55" stop-color="#08111b"/>
      <stop offset="1" stop-color="#0d1521"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111b29"/>
      <stop offset="1" stop-color="#080e17"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#162334" stroke-width="1" opacity="0.55"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)" opacity="0.35"/>
  <ellipse cx="1170" cy="140" rx="360" ry="250" fill="url(#glow2)" filter="url(#soft)"/>
  <ellipse cx="360" cy="420" rx="420" ry="250" fill="url(#glow1)" filter="url(#soft)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="90" y="152" fill="#8ea3bb" font-size="15" letter-spacing="6">PROGRAMMATIC VIDEO STUDIO · LOCAL-FIRST</text>
    <text x="86" y="284" fill="url(#accent)" font-size="132" font-weight="800" letter-spacing="-6">VIDEUR</text>
    <text x="94" y="342" fill="#e7eef8" font-size="27" font-weight="600">Del prompt al MP4. Código real, QA real.</text>
    <text x="94" y="382" fill="#8ea3bb" font-size="17">La IA escribe FFmpeg, Pillow, Manim o Remotion. Videur lo ejecuta,</text>
    <text x="94" y="408" fill="#8ea3bb" font-size="17">lee el error, genera la hoja de contactos y se corrige hasta cerrar el corte.</text>

    <g transform="translate(900 78)">
      <rect width="610" height="348" rx="18" fill="url(#term)" stroke="#2a405a" stroke-width="1.2"/>
      <rect width="610" height="46" rx="18" fill="#131c2b"/>
      <rect y="28" width="610" height="18" fill="#131c2b"/>
      <circle cx="22" cy="23" r="5.5" fill="#f87171"/>
      <circle cx="42" cy="23" r="5.5" fill="#f59e0b"/>
      <circle cx="62" cy="23" r="5.5" fill="#34d399"/>
      <text x="84" y="28" fill="#6ee7b7" font-size="12">›_ terminal — videur</text>

      <text x="26" y="82" fill="#34d399" font-size="14">$</text>
      <text x="46" y="82" fill="#e7eef8" font-size="14">videur render prj_9f3a</text>
      <text x="26" y="112" fill="#8ea3bb" font-size="13">▸ preparing · remotion</text>
      <text x="26" y="134" fill="#8ea3bb" font-size="13">▸ executing · 1080×1920 · 60 fps</text>
      <rect x="26" y="152" width="558" height="10" rx="5" fill="#162334"/>
      <rect x="26" y="152" width="392" height="10" rx="5" fill="url(#accent)"/>
      <text x="26" y="190" fill="#34d399" font-size="13">✓ output.mp4</text>
      <text x="182" y="190" fill="#8ea3bb" font-size="13">— 79.2 s · 16.5 MB</text>
      <text x="26" y="216" fill="#34d399" font-size="13">✓ contact-sheet.png</text>
      <text x="230" y="216" fill="#8ea3bb" font-size="13">— 16 frames · 4×4</text>
      <text x="26" y="242" fill="#34d399" font-size="13">✓ qa</text>
      <text x="84" y="242" fill="#8ea3bb" font-size="13">— motion pass · 0 errors · 0 warnings</text>
      <text x="26" y="284" fill="#22d3ee" font-size="13">▸ agent · correcting timing</text>
      <text x="26" y="308" fill="#8ea3bb" font-size="13">  frame 4389/4752 · time remaining: 2m 6s</text>
      <text x="26" y="334" fill="#6ee7b7" font-size="13">● deterministic render</text>
    </g>

    <text x="94" y="470" fill="#627890" font-size="13" letter-spacing="2.4">BUN · HONO · ELUR · SQLITE · FFMPEG · PILLOW · MANIM · REMOTION</text>
  </g>
</svg>
