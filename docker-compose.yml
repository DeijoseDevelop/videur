services:
  videur:
    build:
      context: .
      args:
        INSTALL_MANIM: "true"
        INSTALL_REMOTION: "true"
    container_name: videur
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/app/data
    environment:
      VIDEUR_HOST: 0.0.0.0
      VIDEUR_PORT: "8787"
      VIDEUR_DATA_DIR: /app/data
      VIDEUR_TEMPLATES_DIR: /app/templates
      VIDEUR_WEB_DIST: /app/apps/web/dist
      VIDEUR_SANDBOX_MODE: docker
      VIDEUR_LOG_LEVEL: info
      HOME: /app/data/.home
      BUN_INSTALL_CACHE_DIR: /app/data/.bun-cache
      REMOTION_BROWSER: /usr/local/bin/chromium-nosandbox
    user: "${UID:-1000}:${GID:-1000}"
    # Nota: `no-new-privileges` puede impedir el exec de Bun en algunas
    # configuraciones de Docker/AppArmor. Se mantiene cap_drop: ALL.
    cap_drop:
      - ALL
    mem_limit: 4g
    cpus: "4"
    pids_limit: 512
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
